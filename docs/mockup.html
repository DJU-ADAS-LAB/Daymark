<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daymark 위젯 목업</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#273327;background:#dfe5dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#dbe5d7,#e9e7dc);padding:40px}.stage{max-width:1100px;margin:auto}.caption{font-size:13px;color:#586757;margin:0 0 10px}.widget{width:390px;height:510px;background:#fffdf8;border:1px solid #d6dfd1;border-radius:18px;box-shadow:0 22px 55px #2438233b;overflow:hidden;display:flex;flex-direction:column;transition:width .25s,height .25s}.widget.expanded{width:760px;height:570px}.bar{height:38px;flex:none;background:#e6efd9;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#334932;font-size:12px;cursor:grab}.brand{font-weight:800;letter-spacing:-.04em}.bar-actions{display:flex;align-items:center;gap:4px}.bar button{border:0;background:transparent;color:#496046;width:26px;height:26px;border-radius:7px;cursor:pointer}.bar button:hover{background:#d5e5ca}.body{display:flex;flex:1;min-height:0}.main{flex:1;min-width:0;padding:20px;display:flex;flex-direction:column}.month{display:none;width:325px;border-right:1px solid #ebefe7;padding:18px;flex-direction:column}.expanded .month{display:flex}.month-title{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;margin-bottom:16px}.month-title button{border:0;background:#edf3e9;width:26px;height:26px;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.week{font-size:11px;color:#839183;padding-bottom:7px}.day{height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:#425142;font-size:12px}.day.selected{background:#557f52;color:#fff;font-weight:800}.day.has:after{content:'·';position:absolute;transform:translateY(10px);font-size:18px}.date{display:flex;justify-content:space-between;align-items:start}.date h1{margin:0;font-size:22px;letter-spacing:-.06em}.date small{display:block;color:#82907e;margin-top:5px;font-size:12px}.progress{font-size:12px;color:#678361;font-weight:700;background:#edf4e8;border-radius:20px;padding:5px 9px}.track{height:5px;background:#eef1e9;border-radius:5px;margin:18px 0 14px;overflow:hidden}.fill{width:33%;height:100%;background:#84aa73}.composer{display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid #dae4d5;background:#f8faf5;border-radius:10px;padding:11px;font-size:13px}.composer button{border:0;background:#2d432d;color:#fff;border-radius:10px;padding:0 14px;font-weight:700}.tasks{overflow:auto;flex:1;min-height:0;margin:16px -4px 0;padding:0 4px;list-style:none}.tasks li{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf0e9;padding:12px 0;font-size:13px}.tasks input{accent-color:#6d9664;width:17px;height:17px}.tasks .done{text-decoration:line-through;color:#a2aea0}.tasks .menu{margin-left:auto;color:#8a9886}.footer{flex:none;border-top:1px solid #eef0e9;padding:9px 18px;font-size:11px;color:#849282;display:flex;justify-content:space-between}.toggle{cursor:pointer;color:#456c45;font-weight:700}.note{font-size:12px;color:#60705e;margin-top:16px;max-width:760px;line-height:1.6}@media(max-width:800px){body{padding:16px}.widget,.widget.expanded{max-width:100%;height:520px}.widget.expanded{width:100%}.month{width:42%}.main{padding:15px}}@media(max-width:560px){.widget.expanded{height:680px}.expanded .body{display:block;overflow:auto}.expanded .month{width:100%;height:280px;border-right:0;border-bottom:1px solid #ebefe7}.expanded .main{height:340px}.day{height:24px}}
</style></head><body><div class="stage"><p class="caption">Daymark · 바탕화면 스티커 위젯 목업</p><div class="widget" id="widget"><div class="bar"><span class="brand">✓ daymark.</span><div class="bar-actions"><span>● 저장됨</span><button title="달력 펼치기" id="expand">▦</button><button title="더보기">···</button><button title="닫기">×</button></div></div><div class="body"><aside class="month"><div class="month-title"><button>‹</button><span>2026년 11월</span><button>›</button></div><div class="grid" id="grid"></div></aside><section class="main"><div class="date"><div><h1>11월 16일 월요일</h1><small>오늘의 체크리스트</small></div><span class="progress">1 / 3 완료</span></div><div class="track"><div class="fill"></div></div><div class="composer"><input placeholder="할 일을 적어주세요" aria-label="할 일 입력"><button>추가</button></div><ul class="tasks"><li><input type="checkbox" checked><span class="done">아침 산책</span><span class="menu">···</span></li><li><input type="checkbox"><span>Rust 위젯 구조 잡기</span><span class="menu">···</span></li><li><input type="checkbox"><span>디자인 확인하기</span><span class="menu">···</span></li></ul></section></div><div class="footer"><span>창을 끌어 원하는 곳에 놓으세요</span><span class="toggle" id="toggle">달력 펼치기 ▦</span></div></div><p class="note">상단의 ▦ 또는 하단의 달력 펼치기를 눌러 두 화면을 비교할 수 있습니다. 이 목업의 입력과 체크 항목은 저장되지 않습니다.</p></div><script>
const w=document.getElementById('widget'),t=document.getElementById('toggle');function toggle(){w.classList.toggle('expanded');t.textContent=w.classList.contains('expanded')?'달력 접기 ▦':'달력 펼치기 ▦'}document.getElementById('expand').onclick=toggle;t.onclick=toggle;const g=document.getElementById('grid');'일월화수목금토'.split('').forEach(x=>{const e=document.createElement('span');e.className='week';e.textContent=x;g.append(e)});for(let i=0;i<31;i++){const e=document.createElement('button');e.className='day'+([5,9,16,24].includes(i)?' has':'')+(i===16?' selected':'');e.textContent=i||'';g.append(e)};
</script></body></html>
